<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>LimeSwap</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15.5' fill='%236f9a10'/%3E%3Ccircle cx='16' cy='16' r='13.5' fill='%23f3f0d8'/%3E%3Ccircle cx='16' cy='16' r='12' fill='%23c6f432'/%3E%3Cg stroke='%23f3f0d8' stroke-width='1.6'%3E%3Cpath d='M16 4v24M5.6 10l20.8 12M5.6 22 26.4 10'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2' fill='%23f3f0d8'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="topbar">
      <a class="brand" href="#swap" aria-label="LimeSwap home">
        <span class="lime-slice logo" aria-hidden="true"></span>
        <span class="brand-name">LimeSwap</span>
      </a>

      <!-- One nav: centred segmented control on desktop, fixed bottom tab bar on a phone (style.css). -->
      <nav class="tabs" aria-label="Sections">
        <button data-tab="swap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v14m0 0-3-3m3 3 3-3M17 20V6m0 0-3 3m3-3 3 3" /></svg><span>Swap</span></button>
        <button data-tab="pools"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg><span>Pools</span></button>
        <button data-tab="liquidity"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z" /></svg><span>Liquidity</span></button>
      </nav>

      <div class="top-right">
        <button class="chip get-tokens" id="get-tokens" aria-label="Get test tokens" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z" /><path d="M12 11v6m-3-3h6" /></svg><span class="lbl">Get test tokens</span>
        </button>
        <span class="chip net" title="Network this app reads from and signs for"><i class="dot"></i><span id="net">…</span></span>
        <span class="chip dev" id="dev-badge" hidden title="Transactions are signed with a local-only test key from .env.local"><span>DEV<span class="hide-sm"> SIGNER</span></span></span>
        <button class="icon-btn" id="theme" aria-label="Switch light or dark mode" title="Light / dark mode">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        </button>
        <div id="account"><button class="btn btn-lime btn-sm" id="connect"><span>Connect<span class="hide-sm"> wallet</span></span></button></div>
      </div>
    </header>

    <main id="main">
      <div class="callout warn banner" id="banner" role="alert" hidden></div>

      <!-- ===================== Get test tokens (src/ui/onboarding.js) ===================== -->
      <section id="onboard" class="page page-narrow" aria-labelledby="onboard-title" hidden>
        <div class="card onboard"><div id="onboard-body"></div><div class="status" id="onboard-status" aria-live="polite"></div></div>
      </section>

      <!-- ===================== Pools ===================== -->
      <section id="tab-pools" class="page page-wide" hidden>
        <h1 class="sr-only">Pools</h1>
        <div class="page-head">
          <span class="live" id="updated" hidden><i class="dot pulse"></i><span></span></span>
        </div>
        <div id="fx-card"><div class="card"><div class="sk sk-title"></div><div class="sk sk-line"></div><div class="sk-grid"><div class="sk sk-block"></div><div class="sk sk-block"></div><div class="sk sk-block"></div></div></div></div>
        <div class="section-head"><h2>LimeSwap pools</h2><span class="sub" id="pool-count"></span></div>
        <div id="pool-list" class="pool-table"><div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div></div>
      </section>

      <!-- ===================== Swap ===================== -->
      <section id="tab-swap" class="page page-narrow" hidden>
        <div class="card swap-card">
          <div class="card-head end">
            <h1 class="sr-only">Swap</h1>
            <div class="pop-wrap">
              <button class="icon-btn" id="swap-settings" aria-label="Slippage settings" aria-expanded="false" aria-controls="settings-pop">
                <span class="slip-chip" id="slip-label">0.5%</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" /></svg>
              </button>
              <div class="popover" id="settings-pop" hidden>
                <label class="pop-title" for="slippage">Max slippage</label>
                <div class="chips" id="slip-chips">
                  <button class="chip-btn" data-slip="0.1">0.1%</button><button class="chip-btn" data-slip="0.5">0.5%</button><button class="chip-btn" data-slip="1">1%</button>
                  <span class="chip-input"><input id="slippage" value="0.5" inputmode="decimal" autocomplete="off" aria-label="Custom max slippage in percent" /><span>%</span></span>
                </div>
                <p class="caption">If the price moves more than this before your swap lands, it cancels and you keep your tokens.</p>
              </div>
            </div>
          </div>

          <div class="panel">
            <label class="panel-label" for="swap-amount">You pay</label>
            <div class="panel-row">
              <input id="swap-amount" class="amount" inputmode="decimal" placeholder="0" autocomplete="off" spellcheck="false" />
              <button class="token-btn" id="swap-in-btn" aria-haspopup="dialog"></button>
            </div>
            <div class="panel-foot"><span id="swap-in-note"></span><span id="swap-in-bal"></span></div>
          </div>
          <div class="flip-wrap"><button class="flip" id="swap-flip" aria-label="Switch pay and receive tokens"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m0 0-5-5m5 5 5-5" /></svg></button></div>
          <div class="panel">
            <span class="panel-label" id="swap-out-label">You receive</span>
            <div class="panel-row">
              <output class="amount" id="swap-out-amount" aria-labelledby="swap-out-label" aria-live="polite">0</output>
              <button class="token-btn" id="swap-out-btn" aria-haspopup="dialog"></button>
            </div>
            <div class="panel-foot"><span id="swap-out-note"></span><span id="swap-out-bal"></span></div>
          </div>

          <div id="swap-quote"></div>
          <div id="routes"></div>
          <div id="swap-notes"></div>
          <button class="btn btn-lime btn-lg" id="swap-go" disabled>Swap</button>
          <div class="status" id="swap-status" aria-live="polite"></div>
        </div>
      </section>

      <!-- ===================== Liquidity ===================== -->
      <section id="tab-liquidity" class="page page-narrow" hidden>
        <h1 class="sr-only">Liquidity</h1>
        <!-- Your positions (with a wallet), then one card to pick a pool and deposit/withdraw, then the pool's numbers. -->
        <div class="card" id="lp-positions-card" hidden>
          <div id="lp-positions" class="positions" aria-label="Your positions"></div>
        </div>
        <div class="card" id="lp-actions">
          <button class="pool-btn" id="lp-pool-btn" aria-haspopup="dialog" aria-label="Choose a pool (loading pools…)"><span class="sk sk-line"></span></button>
          <p class="caption pool-note" id="lp-pool-note" hidden></p>
          <div class="seg" role="tablist" aria-label="Deposit or withdraw">
            <button role="tab" id="lp-tab-deposit" aria-controls="lp-deposit" data-mode="deposit" aria-selected="true">Deposit</button>
            <button role="tab" id="lp-tab-withdraw" aria-controls="lp-withdraw" data-mode="withdraw" aria-selected="false">Withdraw</button>
          </div>

          <div id="lp-deposit" role="tabpanel" aria-labelledby="lp-tab-deposit">
            <div class="panel compact">
              <div class="panel-row">
                <input id="dep-a" class="amount" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="First token amount to deposit" />
                <span class="token-tag" id="dep-a-sym"></span>
              </div>
              <div class="panel-foot"><span></span><span id="dep-a-bal"></span></div>
            </div>
            <div class="plus" aria-hidden="true">+</div>
            <div class="panel compact">
              <div class="panel-row">
                <input id="dep-b" class="amount" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Second token amount to deposit" />
                <span class="token-tag" id="dep-b-sym"></span>
              </div>
              <div class="panel-foot"><span></span><span id="dep-b-bal"></span></div>
            </div>
            <div class="caption" id="dep-note" aria-live="polite"></div>
            <button class="btn btn-lime btn-lg" id="dep-go" disabled>Deposit</button>
          </div>

          <div id="lp-withdraw" role="tabpanel" aria-labelledby="lp-tab-withdraw" hidden>
            <div class="wd-big"><output id="wd-pct-label" for="wd-pct">0%</output><span class="caption">of your LP shares</span></div>
            <input id="wd-pct" type="range" min="0" max="100" step="1" value="0" aria-label="Percentage of your LP shares to withdraw" />
            <div class="chips even" id="wd-chips">
              <button class="chip-btn" data-pct="25">25%</button><button class="chip-btn" data-pct="50">50%</button><button class="chip-btn" data-pct="75">75%</button><button class="chip-btn" data-pct="100">Max</button>
            </div>
            <div id="wd-note" aria-live="polite"></div>
            <button class="btn btn-lime btn-lg" id="wd-go" disabled>Withdraw</button>
          </div>
          <div class="status" id="lp-status" aria-live="polite"></div>
        </div>
        <div class="card" aria-label="Pool details">
          <div id="lp-info"></div>
        </div>
      </section>
    </main>

    <footer class="foot">LimeSwap runs on Stellar <span id="foot-net"></span> only · test tokens with no real value · not audited</footer>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
