[workspace]
resolver = "2"
members = ["contracts/pool", "contracts/factory", "contracts/router", "contracts/arb", "contracts/fx-pool", "contracts/mock-oracle", "contracts/timelock", "contracts/faucet", "contracts/kyc"]

[workspace.dependencies]
soroban-sdk = "=28.0.0"
stellar-contract-utils = "=0.8.0"
stellar-macros = "=0.8.0"
stellar-tokens = "=0.8.0"
stellar-access = "=0.8.0"
stellar-governance = "=0.8.0"
proptest = "1.12"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
